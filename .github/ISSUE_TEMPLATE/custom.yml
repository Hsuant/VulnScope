name: 📝 自定义 Issue
description: 其他类别的 Issue —— 提问、文档建议、讨论、安全报告等不适合上述模板的内容
title: ""
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 自定义 Issue 📝
        Bug 请使用「🐛 Bug 报告」，新功能请使用「✨ 功能建议」。以下内容适用于其他类别。

  - type: dropdown
    id: category
    attributes:
      label: Issue 类别
      description: 选择最接近的类别，便于维护者分流。
      options:
        - ❓ 使用 / 部署提问
        - 📖 文档改进建议
        - 💬 设计 / 架构讨论
        - 🔐 安全相关报告
        - 🧹 代码质量 / 重构建议
        - 🔧 其他
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 内容详情
      description: 请清晰描述你的问题、建议或讨论主题。
      placeholder: |
        尽量包含：背景、问题说明、你期望的回复/结论。
        提问类建议附上已尝试的排查步骤与配置（环境变量可脱敏）。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 补充背景信息
      description: 补充与本次 Issue 相关的版本、环境、截图或日志（注意脱敏，勿填密钥）。
      placeholder: |
        - 版本 / commit：
        - 部署方式：Docker Compose / 本地
        - 数据库：SQLite / MySQL
        - 相关文件或日志（可选）：
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已检索 Issues，没有重复主题
          required: true
        - label: 如需提供服务端日志，已脱敏 request_id 之外的敏感信息
        - label: 若为安全报告，同意不会在本仓库公开环境/密钥等敏感细节（详见安全策略）