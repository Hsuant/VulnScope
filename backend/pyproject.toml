[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscope-backend"
version = "0.2.0"
description = "VulnScope POC 管理系统后端 — POC 管理与持久化存储"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "cachetools>=5.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.3",
    "black>=24.2",
    "mypy>=1.9",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入约定：Depends()/File()/require_roles() 放在参数默认值中是标准写法
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "app.api.deps.require_roles"]

[tool.ruff.lint.per-file-ignores]
# 测试环境变量必须在导入 app 之前设置，允许模块级延迟导入
"tests/conftest.py" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]